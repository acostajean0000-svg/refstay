<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lost? — Refstay</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root { --primary: #FF385C; --ink: #0B1020; --muted: #64748B; --grad: linear-gradient(135deg, #FF385C 0%, #FF7A45 35%, #7C3AED 100%); }
  * { box-sizing: border-box; } html, body { margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(at 20% 30%, #FFE2EC 0px, transparent 50%), radial-gradient(at 80% 70%, #E0E7FF 0px, transparent 50%), white; color: var(--ink); text-align: center; }
  .logo { display: inline-flex; align-items: center; gap: 10px; font-weight: 800; font-size: 22px; font-family: 'Space Grotesk'; margin-bottom: 48px; }
  .logo-mark { width: 40px; height: 40px; border-radius: 12px; background: var(--grad); display: grid; place-items: center; color: white; font-weight: 900; box-shadow: 0 10px 24px rgba(255, 56, 92, .35); }
  h1 { font-family: 'Space Grotesk'; font-size: clamp(80px, 18vw, 160px); margin: 0; line-height: 1; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; letter-spacing: -0.04em; }
  h2 { font-family: 'Space Grotesk'; font-size: clamp(24px, 4vw, 36px); margin: 16px 0 12px; }
  p { color: var(--muted); font-size: 17px; max-width: 460px; margin: 0 auto 32px; }
  .btn { display: inline-flex; gap: 8px; padding: 14px 28px; border-radius: 999px; background: var(--grad); color: white; font-weight: 600; font-size: 15px; text-decoration: none; box-shadow: 0 12px 30px rgba(255, 56, 92, .35); transition: transform .2s; }
  .btn:hover { transform: translateY(-2px); }
</style>
</head>
<body>
<div>
  <a class="logo" href="/"><span class="logo-mark">R</span><span>Refstay</span></a>
  <h1>404</h1>
  <h2>This page took a vacation.</h2>
  <p>Maybe it's checking into a great Airbnb. Either way, it's not here — let's get you back to making money.</p>
  <a class="btn" href="/">Take me home →</a>
</div>
</body>
</html>
