<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Redirecting — Refstay</title>
<meta name="robots" content="noindex,nofollow" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">

<!-- Privacy-friendly analytics by Plausible (site: refstay.com) -->
<script async src="https://plausible.io/js/pa-91gKqq-hi7bdalS3B80Ak.js"></script>
<script>
  window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)},plausible.init=plausible.init||function(i){plausible.o=i||{}};
  plausible.init()
</script>

<style>
  :root {
    --primary: #FF385C;
    --ink: #0B1020;
    --muted: #64748B;
    --grad: linear-gradient(135deg, #FF385C 0%, #FF7A45 35%, #7C3AED 100%);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    color: var(--ink);
    background: radial-gradient(at 20% 30%, #FFE2EC 0px, transparent 50%),
                radial-gradient(at 80% 70%, #E0E7FF 0px, transparent 50%),
                white;
    text-align: center;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    max-width: 440px;
  }
  .logo {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-weight: 800;
    font-size: 22px;
    font-family: 'Space Grotesk', sans-serif;
    margin-bottom: 36px;
  }
  .logo-mark {
    width: 40px; height: 40px;
    border-radius: 12px;
    background: var(--grad);
    display: grid; place-items: center;
    color: white; font-weight: 900;
    box-shadow: 0 10px 24px rgba(255, 56, 92, .35);
  }
  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 28px;
    margin: 0 0 12px;
    letter-spacing: -0.02em;
  }
  .grad {
    background: var(--grad);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  p {
    color: var(--muted);
    font-size: 16px;
    margin: 0 0 28px;
  }
  .by {
    font-size: 13px;
    color: var(--muted);
    margin-top: 8px;
  }
  .by strong { color: var(--ink); }
  .spinner {
    width: 36px;
    height: 36px;
    border: 3px solid rgba(255, 56, 92, 0.15);
    border-top-color: var(--primary);
    border-radius: 50%;
    margin: 0 auto 24px;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .fallback-link {
    display: inline-block;
    margin-top: 16px;
    color: var(--primary);
    font-weight: 600;
    font-size: 14px;
    text-decoration: underline;
  }
  .fallback-link:hover { opacity: 0.8; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <span class="logo-mark">R</span>
    <span>Refstay</span>
  </div>
  <div class="spinner"></div>
  <h1>Finding your <span class="grad">Miami activity</span>...</h1>
  <p>Redirecting you to handpicked boat, jet ski, and watersport rentals.</p>
  <p class="by" id="byline"></p>
  <a class="fallback-link" id="manualLink" href="https://miamijetskiboatrentals.com">
    Tap here if you're not redirected →
  </a>
</div>

<script>
(function() {
  'use strict';

  // Settings
  const MIAMI_SITE = 'https://miamijetskiboatrentals.com';
  const REDIRECT_DELAY_MS = 600; // give Plausible time to record the event

  // Helpers
  function safe(fn) { try { return fn(); } catch (e) { return null; } }

  // 1. Read the slug from URL (?slug=maria-x4k2)
  const url = new URL(window.location.href);
  let slug = url.searchParams.get('slug') || '';
  // Light sanitize — only alphanumerics and hyphens, max 64 chars
  slug = slug.toLowerCase().replace(/[^a-z0-9-]/g, '').slice(0, 64);

  // 2. Build destination URL with ref attached
  let dest = MIAMI_SITE;
  if (slug) {
    dest = MIAMI_SITE + '/?ref=' + encodeURIComponent(slug);
    document.getElementById('byline').innerHTML = 'Referred by <strong>' + slug + '</strong>';
  }
  document.getElementById('manualLink').href = dest;

  // 3. Track the click in Plausible
  safe(() => window.plausible && window.plausible('Referral Click', { props: { slug: slug || 'unknown' } }));

  // 4. Update document title for accessibility
  if (slug) document.title = 'Redirecting (ref: ' + slug + ') — Refstay';

  // 5. Redirect after a short delay so analytics fires reliably
  setTimeout(() => { window.location.replace(dest); }, REDIRECT_DELAY_MS);
})();
</script>

<!-- Fallback for users with JS disabled — 2s meta refresh to homepage -->
<noscript>
  <meta http-equiv="refresh" content="2;url=https://miamijetskiboatrentals.com" />
</noscript>
</body>
</html>
